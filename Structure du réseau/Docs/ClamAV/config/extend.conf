# /etc/systemd/system/clamav-daemon.service.d/extend.conf
# Drop-in créé par le paquet Debian clamav-daemon (rien à faire à la main).
# Il crée le dossier du socket clamd avant le démarrage du démon.
# Visible dans `systemctl status clamav-daemon` (lignes Process ... ExecStartPre).
[Service]
ExecStartPre=-/bin/mkdir -p /run/clamav
ExecStartPre=/bin/chown clamav /run/clamav
