# Directives à AJOUTER à la fin de /etc/clamav/clamd.conf
# pour activer l'analyse en temps réel (clamonacc)

# Bloque l'accès au fichier tant que l'analyse n'est pas terminée
OnAccessPrevention yes

# Dossiers surveillés (directive répétable, une ligne par dossier)
OnAccessIncludePath /home/flo/Téléchargements
OnAccessIncludePath /var/www/data/cv_incoming

# Évite la boucle : clamd lit lui-même les fichiers qu'il analyse
OnAccessExcludeUname clamav

# Ignore les accès faits par root (utile sur un serveur administré en root)
OnAccessExcludeRootUID yes

# Pseudo-systèmes de fichiers à ne jamais analyser
OnAccessExcludePath /proc
OnAccessExcludePath /dev
OnAccessExcludePath /sys
